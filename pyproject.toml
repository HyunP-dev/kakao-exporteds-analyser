[project]
name = "kakaotalk-openchat-analyzer"
version = "0.1.0"
description = ""
authors = [{ name = "Hyun Park", email = "hyunp.dev@gmail.com" }]
requires-python = ">=3.12,<3.13"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PySide6>=6.7.2,<7",
    "plotly>=5.22.0,<6",
    "pandas>=2.2.2,<3",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.4,<7",
    "pyinstaller>=6.8.0,<7",
    "jupyter>=1.0.0,<2",
]

[tool.uv]
default-groups = "all"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
openchat-analyzer = "kakaotalk_openchat_analyzer.main:main"